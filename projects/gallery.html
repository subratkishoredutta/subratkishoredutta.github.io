<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Photo Gallery</title>
  <meta name="description" content="A clean, responsive, accessible photo gallery with a lightbox." />
  <style>
    :root {
      --bg: #0b0e13;
      --card: #121722;
      --text: #e8eef7;
      --muted: #9fb2ca;
      --accent: #5bd7ff;
      --ring: rgba(91, 215, 255, .45);
      --gap: 14px;
      --radius: 16px;
      --shadow: 0 6px 16px rgba(0,0,0,.35), 0 2px 6px rgba(0,0,0,.2);
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f7f9fc;
        --card: #ffffff;
        --text: #0d1726;
        --muted: #4b5a6b;
        --accent: #0ea5e9;
        --ring: rgba(14,165,233,.25);
        --shadow: 0 10px 20px rgba(0,0,0,.08), 0 3px 8px rgba(0,0,0,.06);
      }
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, "Helvetica Neue", Arial, "Noto Sans", "Apple Color Emoji", "Segoe UI Emoji";
      background: radial-gradient(1200px 800px at 80% -10%, rgba(91,215,255,.10), transparent 60%), var(--bg);
      color: var(--text);
    }

    header {
      max-width: 1200px;
      margin: 28px auto 10px;
      padding: 0 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .title {
      display: flex; align-items: baseline; gap: 12px;
    }
    h1 {
      margin: 0;
      font-size: clamp(22px, 4vw, 34px);
      letter-spacing: .2px;
    }
    .subtitle {
      margin: 0; color: var(--muted); font-size: clamp(12px, 2vw, 14px);
    }

    .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .btn {
      appearance: none; border: 0; background: var(--card); color: var(--text);
      padding: 10px 14px; border-radius: 12px; box-shadow: var(--shadow);
      cursor: pointer; transition: transform .06s ease, box-shadow .2s ease, outline-color .2s ease;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }

    main {
      max-width: 1200px; margin: 0 auto; padding: 8px 18px 48px;
    }

    /* Gallery grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: var(--gap);
    }

    .card {
      position: relative; overflow: hidden; border-radius: var(--radius);
      background: var(--card); box-shadow: var(--shadow);
      isolation: isolate;
    }
    .card picture, .card img { display: block; width: 100%; height: 100%; }
    .card img { aspect-ratio: 4/3; object-fit: cover; filter: saturate(1.02) contrast(1.02); }

    .card .cap {
      position: absolute; inset: auto 0 0 0; padding: 10px 12px;
      background: linear-gradient(transparent, rgba(0,0,0,.55)); color: #fff;
      font-size: 13px; line-height: 1.25; text-shadow: 0 1px 2px rgba(0,0,0,.5);
    }

    .card .hover {
      position: absolute; inset: 0; opacity: 0; transition: opacity .2s ease;
      background: radial-gradient(400px 220px at var(--mx,50%) var(--my,50%), rgba(91,215,255,.22), transparent 60%);
      pointer-events: none;
    }
    .card:hover .hover { opacity: 1; }

    /* Lightbox */
    .lightbox {
      position: fixed; inset: 0; display: none; place-items: center;
      background: rgba(0,0,0,.75); z-index: 50; padding: 24px;
      backdrop-filter: blur(2px);
    }
    .lightbox.open { display: grid; }
    .lb-frame {
      width: min(95vw, 1200px); max-height: 90vh; display: grid; grid-template-rows: 1fr auto; gap: 10px;
    }
    .lb-media { position: relative; background: #000; border-radius: 14px; overflow: hidden; }
    .lb-media img { width: 100%; height: 100%; object-fit: contain; display: block; }

    .lb-caption { color: #eaeef7; font-size: 14px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .lb-caption .text { opacity: .9; }

    .lb-actions { position: absolute; inset: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 6px; }
    .iconbtn {
      appearance: none; border: 0; background: rgba(20,25,35,.6); color: #fff; width: 44px; height: 44px; border-radius: 999px;
      display: grid; place-items: center; cursor: pointer; transition: transform .06s ease, background .2s ease;
    }
    .iconbtn:hover { transform: translateY(-1px); background: rgba(20,25,35,.8); }
    .closebtn {
      position: absolute; top: 10px; right: 10px;
      width: 40px; height: 40px; background: rgba(20,25,35,.6);
    }

    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 1px, 1px); white-space: nowrap; border: 0; }

    footer { max-width: 1200px; margin: 24px auto; padding: 0 18px; color: var(--muted); font-size: 13px; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <header>
    <div class="title">
      <h1>My Photo Gallery</h1>
      <p class="subtitle">Responsive grid · Click any photo to view large</p>
    </div>
    <div class="toolbar">
      <button class="btn" id="selectAll">Select all</button>
      <button class="btn" id="downloadSelected" aria-label="Download selected (opens each in a new tab)">Download</button>
      <button class="btn" id="clearSelection">Clear</button>
    </div>
  </header>

  <main>
    <ul class="grid" id="gallery" aria-label="Photo gallery">
      <!-- 👇 Replace the demo items with your own images. Example pattern shown. -->
      <!-- Template: <li class="card"><img src="PATH/FILE.jpg" alt="Short description" loading="lazy" data-caption="Optional caption here" /></li> -->

      <li class="card">
        <img src="../assets/group.jpg" alt="Stroll across Saarschleife" loading="lazy" data-caption="Stroll across Saarschleif" />
        <div class="hover" aria-hidden="true"></div>
        <div class="cap">Alpine glow over the ridge</div>
      </li>
      <li class="card">
        <img src="../assets/saarschliefe_boat.jpg" alt="boat" loading="lazy" data-caption="Long way to go" />
        <div class="hover" aria-hidden="true"></div>
        <div class="cap">Palm lines</div>
      </li>
      <li class="card">
        <img src="../assets/car.jpg" alt="Car" loading="lazy" data-caption="Driving through the fire" />
        <div class="hover" aria-hidden="true"></div>
        <div class="cap">City at blue hour</div>
      </li>
      <li class="card">
        <img src="https://images.unsplash.com/photo-1519681393784-d120267933ba?q=80&w=1600&auto=format&fit=crop" alt="Books stacked on a wooden table" loading="lazy" data-caption="Study table" />
        <div class="hover" aria-hidden="true"></div>
        <div class="cap">Study table</div>
      </li>
      <li class="card">
        <img src="https://images.unsplash.com/photo-1499084732479-de2c02d45fc4?q=80&w=1600&auto=format&fit=crop" alt="Headphones on a desk" loading="lazy" data-caption="Listen & focus" />
        <div class="hover" aria-hidden="true"></div>
        <div class="cap">Listen &amp; focus</div>
      </li>
      <li class="card">
        <img src="https://images.unsplash.com/photo-1518837695005-2083093ee35b?q=80&w=1600&auto=format&fit=crop" alt="Succulent plant close-up" loading="lazy" data-caption="Green patterns" />
        <div class="hover" aria-hidden="true"></div>
        <div class="cap">Green patterns</div>
      </li>
    </ul>
  </main>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" aria-modal="true" role="dialog" aria-label="Image viewer">
    <div class="lb-frame">
      <div class="lb-media">
        <button class="iconbtn closebtn" id="lbClose" aria-label="Close viewer">✕</button>
        <div class="lb-actions">
          <button class="iconbtn" id="lbPrev" aria-label="Previous image" title="Previous">⟨</button>
          <button class="iconbtn" id="lbNext" aria-label="Next image" title="Next">⟩</button>
        </div>
        <img id="lbImg" alt="Expanded view" />
      </div>
      <div class="lb-caption">
        <div class="text" id="lbCap">&nbsp;</div>
        <div class="count" id="lbCount"></div>
      </div>
    </div>
  </div>

  <footer>
    <p>&copy; 2025 Subrat Kishore Dutta. All rights reserved.</p>
  </footer>

  <script>
    // Ripple hover position for cards
    const grid = document.getElementById('gallery');
    grid.addEventListener('mousemove', (e) => {
      const card = e.target.closest('.card');
      if (!card) return;
      const r = card.getBoundingClientRect();
      card.style.setProperty('--mx', `${e.clientX - r.left}px`);
      card.style.setProperty('--my', `${e.clientY - r.top}px`);
    });

    // Selection logic
    const selected = new Set();
    function updateSelectionUI() {
      document.querySelectorAll('.card').forEach((c, i) => {
        c.style.outline = selected.has(i) ? `2px solid var(--accent)` : 'none';
        c.style.outlineOffset = selected.has(i) ? '2px' : '0';
      });
    }

    grid.querySelectorAll('.card').forEach((card, index) => {
      card.addEventListener('click', (e) => {
        // Lightbox open on image click without modifier; with meta/ctrl toggles selection
        const img = card.querySelector('img');
        if (e.metaKey || e.ctrlKey) {
          if (selected.has(index)) selected.delete(index); else selected.add(index);
          updateSelectionUI();
        } else {
          openLightbox(index);
        }
      });
    });

    document.getElementById('selectAll').addEventListener('click', () => {
      selected.clear();
      grid.querySelectorAll('.card').forEach((_, i) => selected.add(i));
      updateSelectionUI();
    });
    document.getElementById('clearSelection').addEventListener('click', () => {
      selected.clear();
      updateSelectionUI();
    });

    document.getElementById('downloadSelected').addEventListener('click', () => {
      if (!selected.size) { alert('No photos selected. Hold Ctrl/Cmd and click to select.'); return; }
      selected.forEach((i) => {
        const img = grid.querySelectorAll('.card img')[i];
        if (img) window.open(img.src, '_blank');
      });
    });

    // Lightbox functionality
    const lb = document.getElementById('lightbox');
    const lbImg = document.getElementById('lbImg');
    const lbCap = document.getElementById('lbCap');
    const lbCount = document.getElementById('lbCount');
    const imgs = Array.from(document.querySelectorAll('#gallery img'));
    let current = 0;

    function openLightbox(index) {
      current = index;
      const { src, alt } = imgs[current];
      lbImg.src = src; lbImg.alt = alt || 'Photo';
      lbCap.textContent = imgs[current].dataset.caption || alt || '';
      lbCount.textContent = `${current + 1} / ${imgs.length}`;
      lb.classList.add('open');
      document.body.style.overflow = 'hidden';
    }
    function closeLightbox() {
      lb.classList.remove('open');
      document.body.style.overflow = '';
      lbImg.src = '';
    }
    function next() {
      current = (current + 1) % imgs.length; openLightbox(current);
    }
    function prev() {
      current = (current - 1 + imgs.length) % imgs.length; openLightbox(current);
    }

    document.getElementById('lbClose').addEventListener('click', closeLightbox);
    document.getElementById('lbNext').addEventListener('click', next);
    document.getElementById('lbPrev').addEventListener('click', prev);
    lb.addEventListener('click', (e) => { if (e.target === lb) closeLightbox(); });

    window.addEventListener('keydown', (e) => {
      if (!lb.classList.contains('open')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowRight') next();
      if (e.key === 'ArrowLeft') prev();
    });
  </script>
</body>
</html>
